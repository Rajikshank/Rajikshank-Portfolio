[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.29.3"

[[redirects]]
  from = "/projects/*"
  to = "/work/:splat"
  status = 301

[[redirects]]
  from = "/projects"
  to = "/work/"
  status = 301

[[redirects]]
  from = "/writing/*"
  to = "/notes/:splat"
  status = 301

[[redirects]]
  from = "/writing"
  to = "/notes/"
  status = 301

[[redirects]]
  from = "/experience"
  to = "/about/"
  status = 301

[[redirects]]
  from = "/contact"
  to = "/about/"
  status = 301

[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/_astro/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
